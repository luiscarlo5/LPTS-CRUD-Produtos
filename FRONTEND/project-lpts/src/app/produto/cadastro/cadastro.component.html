<div class="container w-full min-h-screen">
<div class="max-w-md mx-auto mt-16 p-8 bg-white rounded-2xl shadow-lg flex flex-col gap-2">
  <h2 class="text-2xl font-bold text-center mb-4">Cadastrar produto</h2>

  <mat-form-field>
    <mat-label>Nome</mat-label>
    <input matInput [(ngModel)]="produto.name" name="name">
  </mat-form-field>

  <mat-form-field>
    <mat-label>Descrição</mat-label>
    <textarea matInput [(ngModel)]="produto.description" name="description"></textarea>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Preço</mat-label>
    <input matInput type="number" [(ngModel)]="produto.price" name="price">
  </mat-form-field>

  <div class="flex flex-col gap-2 mb-2">
    <label class="text-sm text-gray-700">Imagem</label>

    <input
      #fileInput
      type="file"
      accept="image/*"
      (change)="onImagemSelecionada($event)"
      class="hidden"
    >

    <div class="flex items-center gap-3">
      <button type="button" mat-stroked-button (click)="fileInput.click()">
        <mat-icon fontIcon="image"></mat-icon>
        Escolher imagem
      </button>

      <span class="text-sm text-gray-500 truncate">
        {{ imagemSelecionada?.name ?? 'Nenhum arquivo selecionado' }}
      </span>
    </div>

    <div *ngIf="previewUrl" class="relative w-32 h-32">
      <img [src]="previewUrl" alt="Pré-visualização" class="w-32 h-32 object-cover rounded-lg border border-gray-300">
      <button
        type="button"
        mat-icon-button
        (click)="removerImagem(fileInput)"
        class="!absolute -top-2 -right-2 !bg-white !w-6 !h-6 !min-w-0 shadow"
      >
        <mat-icon fontIcon="close" class="!text-base"></mat-icon>
      </button>
    </div>
  </div>

  <button mat-flat-button color="primary" (click)="salvar()">Salvar</button>
</div>
</div>
